name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # Build into the local daemon first so the image can be scanned
      # (and an SBOM generated) before anything is published.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: mdshare:release
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy before pushing
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: mdshare:release
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table

      - name: Smoke test local image against a real PostgreSQL
        run: |
          docker network create smoke
          docker run -d --name db --network smoke \
            -e POSTGRES_USER=mdshare -e POSTGRES_PASSWORD=mdshare -e POSTGRES_DB=mdshare \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec db pg_isready -U mdshare >/dev/null 2>&1 && break
            sleep 1
          done
          docker run -d --name app --network smoke -p 20080:20080 \
            -e DATABASE_URL=postgresql://mdshare:mdshare@db:5432/mdshare \
            mdshare:release
          for i in $(seq 1 30); do
            curl -fsS http://localhost:20080/health && break
            sleep 1
          done
          BODY=$(curl -fsS -X POST http://localhost:20080/api/paste -H 'Content-Type: application/json' -d '{"content":"# smoke test"}')
          ID=$(echo "$BODY" | grep -o '"id":"[^"]*"' | cut -d'"' -f4)
          curl -fsS "http://localhost:20080/api/paste/$ID" | grep -q 'smoke test'
          echo "smoke test passed"

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: mdshare:release
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Push image to GHCR
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Sign image with cosign (keyless)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Collect image digest and checksums
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${{ steps.meta.outputs.version }}"
          DIGEST=$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')
          cosign sign --yes "${IMAGE}@${DIGEST}"
          echo "$IMAGE $DIGEST" | tee checksums.txt
          sha256sum checksums.txt >> checksums.txt

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            checksums.txt
            sbom.spdx.json
          generate_release_notes: true
